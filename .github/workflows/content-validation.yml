name: Validate study-plan content

on:
  push:
    paths:
      - "**.md"
      - "scripts/*.py"
      - ".github/workflows/content-validation.yml"
  pull_request:
    paths:
      - "**.md"
      - "scripts/validate_study_plan.py"
      - ".github/workflows/content-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate lesson and tracker coverage and internal Markdown links
        run: python scripts/validate_study_plan.py
      - name: Validate lesson structure, listening evidence cues, and checkpoint weights
        run: python scripts/validate_lesson_quality.py
